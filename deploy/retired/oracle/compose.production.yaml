name: usage-monitor

# This file is installed root-owned at /etc/usage-monitor/compose.yaml.
# Production deploys must use that installed copy, never a compose file from a
# newly fetched revision. In particular, there is intentionally no `build:`
# key and no repo-controlled host mount.
services:
  app:
    image: usage-monitor:${USAGE_MONITOR_REVISION:?USAGE_MONITOR_REVISION is required}
    pull_policy: never
    env_file:
      # Synced from Infisical into tmpfs by usage-monitor-env-sync; never a
      # disk-backed .env. docker compose fails if this file is missing, so the
      # sync unit is Requires/Before usage-monitor.service and the deploy
      # transaction re-syncs (with a bounded stale fallback) before preflight.
      - /run/usage-monitor/usage-monitor.env
    environment:
      DATABASE_URL: file:/data/prod.db
      GIT_COMMIT_SHA: ${USAGE_MONITOR_REVISION}
      # Non-secret replica heartbeat written by usage-monitor-replica-status
      # (temp+rename, so never torn). /api/ready fails a required backup when
      # this file is missing/stale/unhealthy instead of trusting the
      # startup-only LITESTREAM_ACTIVE claim. Freshness budget stays on the
      # LITESTREAM_REPLICA_MAX_AGE_SECONDS default (10800s / 3h), matching the
      # deploy gate and 1h Litestream sync-interval.
      LITESTREAM_REPLICA_STATUS_PATH: /data/.litestream-replica-status.json
      PORT: "3000"
    user: "1000:1000"
    volumes:
      - /data:/data
    # Keep Docker-level restart disabled permanently. Only systemd may start the
    # SQLite writer, after ConditionPathIsMountPoint/RequiresMountsFor verify
    # that /data is the dedicated block volume.
    restart: "no"
    stop_grace_period: 60s
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  caddy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    pull_policy: never
    environment:
      # Interpolated from the compose project env (the synced tmpfs env file in
      # Infisical mode, host.env in legacy mode) so Caddy receives exactly this
      # one value and never the app's secret env_file.
      USAGE_MONITOR_HOSTNAME: ${USAGE_MONITOR_HOSTNAME:?USAGE_MONITOR_HOSTNAME is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/usage-monitor/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
