name: Auto-merge PRs

# Enable GitHub auto-merge on every non-draft, same-repo PR so green CI
# lands without a human click (owner fleet policy: always auto-merge).
#
# WHY THIS WORKFLOW NO LONGER ARMS AUTO-MERGE BY DEFAULT (2026-08-13)
# -------------------------------------------------------------------
# Arming auto-merge with `secrets.GITHUB_TOKEN` makes github-actions[bot] the
# MERGING identity, and GitHub's recursion guard means events produced by the
# GITHUB_TOKEN never start a workflow run.  The resulting push to main therefore
# dispatches NOTHING -- no CI, no CodeQL, no Security, no effort sync, and no
# iOS TestFlight ship.
#
# Measured on this repo: PR #1145 (bot-merged, touches ios/) produced no
# ios-ship run at all, while #1159 (human-merged) produced the only ios-ship
# run this repo has ever had.  The same A/B on Congress.Trade: sha c38b6787
# (bot) -> 0 runs, sha ceaca097 (human) -> 5 push runs.
#
# So this workflow now refuses to arm unless an elevated identity is available
# (GH_PAT or SHEPHERD_TOKEN).  Neither secret exists today, so this workflow is
# a deliberate, logged no-op and PRs are landed the way AGENTS.md already
# prescribes -- the landing agent runs, under the owner's own gh credentials:
#
#     gh pr merge <n> --squash --auto
#
# which makes merged_by=jaywedgeworth22 and re-dispatches every push workflow.
#
# TO RE-ACTIVATE (owner action; agents never mint credentials): add a
# fine-grained PAT or GitHub App installation token with contents+pull_requests
# write as the repo secret GH_PAT.  No code change is needed -- this workflow
# self-activates and arms under that identity.
on:
  # Privileged arming runs only from the trusted default-branch workflow definition.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, converted_to_draft, ready_for_review, auto_merge_enabled]
  workflow_run:
    workflows: [Auto-merge review signal]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Same-repo only (not untrusted forks).  Live state below decides whether to arm or disarm.
    if: >
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Read live PR merge eligibility
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_PULL_REQUESTS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          SIGNAL_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          {
            echo "armable=0"
            echo "disarm=1"
            echo "head_sha="
            echo "pr_number="
          } >> "$GITHUB_OUTPUT"
          PR_NUMBER="$EVENT_PR_NUMBER"
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            PR_NUMBER=""
          fi
          REVIEW_METADATA_HEAD=""
          review_metadata_valid() {
            jq -e --argjson repo_id "$REPO_ID" '
              type == "array" and length == 1 and (.[0] |
                type == "object" and
                (.number | type == "number" and . > 0 and . <= 9007199254740991 and . == floor) and
                (.base.repo.id | type == "number" and . == $repo_id) and
                (.head.repo.id | type == "number" and . == $repo_id) and
                (.head.sha | type == "string" and test("^[0-9a-fA-F]{40}$")))
              ' <<< "$1" >/dev/null
          }
          if [ -z "$PR_NUMBER" ]; then
            # Review workflows run on the merge ref; only associated PR metadata identifies its head.
            METADATA="$REVIEW_PULL_REQUESTS"
            if [[ ! "$REPO_ID" =~ ^[1-9][0-9]*$ ]] || ! review_metadata_valid "$METADATA"; then
              if [[ "$SIGNAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                if fetched=$(gh api "repos/$REPO/actions/runs/$SIGNAL_RUN_ID" --jq '.pull_requests' 2>/dev/null); then
                  METADATA="$fetched"
                fi
              fi
            fi
            if [[ ! "$REPO_ID" =~ ^[1-9][0-9]*$ ]] || ! review_metadata_valid "$METADATA"; then
              echo "::notice::Review signal PR metadata was missing or invalid; exiting without arming or disarming."
              # Override the fail-safe default so Disarm does not run without a PR number.
              echo "disarm=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUMBER=$(jq -r '.[0].number' <<< "$METADATA")
            REVIEW_METADATA_HEAD=$(jq -r '.[0].head.sha' <<< "$METADATA")
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::PR number was missing or invalid; exiting without arming or disarming."
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if ! live=$(gh api "repos/$REPO/pulls/$PR_NUMBER"); then
            echo "::warning::Live PR lookup failed; any armed auto-merge will be disabled."
            exit 0
          fi
          if ! jq -e '(.number | type == "number") and (.base.repo.full_name | type == "string") and (.state | type == "string") and (.draft | type == "boolean") and (.title | type == "string") and (.labels | type == "array") and all(.labels[]?; .name | type == "string") and (.head.repo.full_name | type == "string") and (.head.sha | type == "string") and has("auto_merge") and (.auto_merge == null or (.auto_merge | type == "object"))' <<< "$live" >/dev/null; then
            echo "::warning::Live PR response was incomplete; any armed auto-merge will be disabled."
            exit 0
          fi
          state=$(jq -r '.state // empty' <<< "$live")
          draft=$(jq -r '.draft' <<< "$live")
          number=$(jq -r '.number' <<< "$live")
          base_repo=$(jq -r '.base.repo.full_name' <<< "$live")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<< "$live")
          head_sha=$(jq -r '.head.sha // empty' <<< "$live")
          if [ "$number" != "$PR_NUMBER" ] || [ "$base_repo" != "$REPO" ] || [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$head_repo" != "$REPO" ] || [ -z "$head_sha" ]; then
            exit 0
          fi
          if [ -n "$REVIEW_METADATA_HEAD" ] && [ "$head_sha" != "$REVIEW_METADATA_HEAD" ]; then
            echo "::notice::Review signal metadata is stale; any armed auto-merge will be disabled."
            exit 0
          fi
          if jq -e '[.labels[]?.name | ascii_downcase] | any(. == "do-not-merge" or . == "do-not-automerge" or . == "do-not-auto-merge")' <<< "$live" >/dev/null; then
            exit 0
          fi
          title=$(jq -r '.title | ascii_downcase' <<< "$live")
          case "$title" in
            *do-not-merge*|*do\ not\ merge*|*do-not-automerge*|*do\ not\ automerge*|*do-not-auto-merge*|*do\ not\ auto-merge*|*do\ not\ auto\ merge*) exit 0 ;;
          esac
          {
            echo "armable=1"
            echo "disarm=0"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      # `secrets` is not available in a job-level `if:`, so the presence test
      # happens here in `env` and gates the arming step below.
      - name: Check for an elevated (non-GITHUB_TOKEN) merge identity
        id: identity
        if: steps.live.outputs.armable == '1'
        env:
          HAS_ELEVATED_TOKEN: ${{ (secrets.GH_PAT != '' || secrets.SHEPHERD_TOKEN != '') && '1' || '0' }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.live.outputs.pr_number }}
        run: |
          set -uo pipefail
          if [ "$HAS_ELEVATED_TOKEN" = "1" ]; then
            echo "arm=1" >> "$GITHUB_OUTPUT"
            echo "Elevated merge identity present; auto-merge will be armed."
            exit 0
          fi
          echo "arm=0" >> "$GITHUB_OUTPUT"
          echo "::notice::No GH_PAT / SHEPHERD_TOKEN configured.  Not arming auto-merge:"
          echo "::notice::a GITHUB_TOKEN merge dispatches no post-merge workflows (CI, ship, sync)."
          {
            echo "### Auto-merge not armed"
            echo
            echo "No \`GH_PAT\` / \`SHEPHERD_TOKEN\` secret is configured, so arming"
            echo "auto-merge here would merge as \`github-actions[bot]\` and GitHub's"
            echo "recursion guard would suppress **every** post-merge workflow on main."
            echo
            echo "Land this PR with the owner's own credentials instead:"
            echo
            echo '```'
            echo "gh pr merge $PR_URL --squash --auto"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Arm only while the fleet reviewer's latest review on the PR's CURRENT head
      # commit is APPROVED (a skipped check, a COMMENTED review, a stale approval or a
      # lookup failure all leave auto-merge unarmed).  Same rule as the fleet's reusable
      # armer in AI-Fleet-Coordinator.
      - name: Require a current-head approval from the fleet reviewer
        id: approval
        if: steps.live.outputs.armable == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.live.outputs.pr_number }}
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
        run: |
          set -uo pipefail
          echo "ok=0" >> "$GITHUB_OUTPUT"
          if ! reviews=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --jq '.[] | [.user.login, .commit_id, .state] | @tsv'); then
            echo "::notice::Review lookup failed; not arming auto-merge."
            exit 0
          fi
          latest=$(printf '%s\n' "$reviews" | awk -F'\t' -v sha="$HEAD_SHA" '$1=="kody-ai[bot]" && $2==sha {s=$3} END{print s}')
          if [ "$latest" = "APPROVED" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No current-head Kody approval (latest: ${latest:-none}); not arming auto-merge."
          fi

      # Cancellation uses only the repository token and does not depend on the elevated
      # token existing.  A known armed merge must be observed as disabled afterward.
      - name: Disarm a held, draft, unreadable, or unapproved PR
        # Token presence limits this workflow's unapproved-head cancellation; it does not identify who armed the PR.
        # Holds and drafts still disarm regardless of the elevated token or arming actor.
        if: steps.live.outputs.disarm == '1' || (steps.live.outputs.armable == '1' && steps.identity.outputs.arm == '1' && steps.approval.outputs.ok != '1')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.live.outputs.pr_number }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.live.outputs.pr_number }}
        run: |
          set -euo pipefail
          live=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          jq -e --arg repo "$REPO" --argjson number "$PR_NUMBER" 'type == "object" and (.number == $number) and (.base.repo.full_name == $repo) and has("auto_merge") and (.auto_merge == null or (.auto_merge | type == "object"))' <<< "$live" >/dev/null
          if jq -e '.auto_merge == null' <<< "$live" >/dev/null; then
            echo "::notice::No armed auto-merge to cancel."
            exit 0
          fi
          gh pr merge --disable-auto "$PR_URL"
          after=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          jq -e --arg repo "$REPO" --argjson number "$PR_NUMBER" 'type == "object" and (.number == $number) and (.base.repo.full_name == $repo) and has("auto_merge") and .auto_merge == null' <<< "$after" >/dev/null || {
            echo "::error::Auto-merge remained armed after cancellation."
            exit 1
          }

      - name: Enable auto-merge (squash + delete branch)
        if: steps.live.outputs.armable == '1' && steps.identity.outputs.arm == '1' && steps.approval.outputs.ok == '1'
        env:
          MERGE_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.live.outputs.pr_number }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.live.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.live.outputs.head_sha }}
        run: |
          set -euo pipefail
          live_is_armable() {
            local live="$1" title
            jq -e --arg repo "$REPO" --argjson number "$PR_NUMBER" '(.number == $number) and (.base.repo.full_name == $repo) and (.state | type == "string") and (.draft | type == "boolean") and (.title | type == "string") and (.labels | type == "array") and all(.labels[]?; .name | type == "string") and (.head.repo.full_name | type == "string") and (.head.sha | type == "string") and has("auto_merge") and (.auto_merge == null or (.auto_merge | type == "object"))' <<< "$live" >/dev/null || return 1
            [ "$(jq -r '.state // empty' <<< "$live")" = "open" ] || return 1
            [ "$(jq -r '.draft' <<< "$live")" = "false" ] || return 1
            [ "$(jq -r '.head.repo.full_name // empty' <<< "$live")" = "$REPO" ] || return 1
            [ "$(jq -r '.head.sha // empty' <<< "$live")" = "$EXPECTED_HEAD" ] || return 1
            ! jq -e '[.labels[]?.name | ascii_downcase] | any(. == "do-not-merge" or . == "do-not-automerge" or . == "do-not-auto-merge")' <<< "$live" >/dev/null || return 1
            title=$(jq -r '.title | ascii_downcase' <<< "$live")
            case "$title" in
              *do-not-merge*|*do\ not\ merge*|*do-not-automerge*|*do\ not\ automerge*|*do-not-auto-merge*|*do\ not\ auto-merge*|*do\ not\ auto\ merge*) return 1 ;;
            esac
            return 0
          }
          kody_approval_current() {
            local reviews
            reviews=$(GH_TOKEN="$REPO_TOKEN" gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100") || return 1
            jq -e --arg sha "$EXPECTED_HEAD" '
              type == "array" and all(.[]; type == "array") and
              all(.[][]; (.user.login | type == "string") and (.commit_id | type == "string") and (.state | type == "string")) and
              ([.[][] | select(.user.login == "kody-ai[bot]" and .commit_id == $sha)] | last | .state == "APPROVED")
              ' <<< "$reviews" >/dev/null
          }
          disable_auto_merge() {
            local current after
            current=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER")
            jq -e --arg repo "$REPO" --argjson number "$PR_NUMBER" 'type == "object" and (.number == $number) and (.base.repo.full_name == $repo) and has("auto_merge") and (.auto_merge == null or (.auto_merge | type == "object"))' <<< "$current" >/dev/null
            if jq -e '.auto_merge == null' <<< "$current" >/dev/null; then
              return 0
            fi
            GH_TOKEN="$REPO_TOKEN" gh pr merge --disable-auto "$PR_URL"
            after=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER")
            jq -e --arg repo "$REPO" --argjson number "$PR_NUMBER" 'type == "object" and (.number == $number) and (.base.repo.full_name == $repo) and has("auto_merge") and .auto_merge == null' <<< "$after" >/dev/null
          }
          if ! live=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER") || ! live_is_armable "$live"; then
            echo "::warning::Live PR state changed before auto-merge; refusing to arm."
            disable_auto_merge
            exit 0
          fi
          if ! kody_approval_current; then
            echo "::warning::Current-head Kody approval is unavailable or revoked; refusing to arm."
            disable_auto_merge
            exit 0
          fi
          echo "Enabling auto-merge for $PR_URL"
          # Prefer squash (clean main).  Fall back to merge if squash blocked.
          if ! GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash --delete-branch --match-head-commit "$EXPECTED_HEAD" "$PR_URL"; then
            echo "squash auto-merge failed; trying merge commit"
            if ! live=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER") || ! live_is_armable "$live"; then
              echo "::warning::Live PR state changed before merge fallback; refusing to arm."
              disable_auto_merge
              exit 0
            fi
            if ! kody_approval_current; then
              echo "::warning::Current-head Kody approval is unavailable or revoked before merge fallback; refusing to arm."
              disable_auto_merge
              exit 0
            fi
            GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --merge --delete-branch --match-head-commit "$EXPECTED_HEAD" "$PR_URL"
          fi
