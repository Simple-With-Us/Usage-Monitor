name: Auto-merge congress-trading-shared PRs

# Same elevated-identity rule as .github/workflows/auto-merge-prs.yml: arming
# auto-merge with GITHUB_TOKEN makes github-actions[bot] the merging identity,
# and GitHub's recursion guard then suppresses every post-merge workflow on
# main (CI, CodeQL, Security, effort sync, iOS ship). Without GH_PAT /
# SHEPHERD_TOKEN this workflow is a logged no-op; land the PR with the owner's
# own gh credentials instead (`gh pr merge <n> --squash --auto`).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # Re-evaluate the approval gate when the reviewer submits or a review is dismissed.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check if PR updates congress-trading-shared
        id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          IS_SHARED=false
          if [[ "$HEAD_REF" =~ (dependabot|congress-trading-shared|shared-package|bump-congress|antigravity/bump) ]]; then
            IS_SHARED=true
          elif [[ "$TITLE" =~ (congress-trading-shared|shared-package|@jaywedgeworth22/congress-trading-shared) ]]; then
            IS_SHARED=true
          fi
          echo "is_shared=$IS_SHARED" >> "$GITHUB_OUTPUT"

      - name: Check for an elevated (non-GITHUB_TOKEN) merge identity
        id: identity
        if: steps.check.outputs.is_shared == 'true'
        env:
          HAS_ELEVATED_TOKEN: ${{ (secrets.GH_PAT != '' || secrets.SHEPHERD_TOKEN != '') && '1' || '0' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          if [ "$HAS_ELEVATED_TOKEN" = "1" ]; then
            echo "arm=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "arm=0" >> "$GITHUB_OUTPUT"
          echo "::notice::No GH_PAT / SHEPHERD_TOKEN configured; not arming auto-merge."
          echo "::notice::Land it with: gh pr merge $PR_URL --squash --auto"

      # Arm only while the fleet reviewer's latest review on the PR's CURRENT head
      # commit is APPROVED (a skipped check, a COMMENTED review, a stale approval or a
      # lookup failure all leave auto-merge unarmed).  Same rule as the fleet's reusable
      # armer in AI-Fleet-Coordinator.
      - name: Require a current-head approval from the fleet reviewer
        id: approval
        if: steps.identity.outputs.arm == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          echo "ok=0" >> "$GITHUB_OUTPUT"
          if ! reviews=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --jq '.[] | [.user.login, .commit_id, .state] | @tsv'); then
            echo "::notice::Review lookup failed; not arming auto-merge."
            exit 0
          fi
          latest=$(printf '%s\n' "$reviews" | awk -F'\t' -v sha="$HEAD_SHA" '$1=="kody-ai[bot]" && $2==sha && ($3=="APPROVED"||$3=="CHANGES_REQUESTED"||$3=="DISMISSED") {s=$3} END{print s}')
          if [ "$latest" = "APPROVED" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No current-head Kody approval (latest: ${latest:-none}); not arming auto-merge."
          fi

      # A push after an approval leaves a previously armed merge in place, so when
      # this workflow is the armer (a merge identity exists) and the current head has
      # no approval, cancel any armed merge.  Cancelling uses only the repository
      # token; it never arms.
      - name: Disarm when the current head is not approved
        if: steps.identity.outputs.arm == '1' && steps.approval.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --disable-auto "$PR_URL" || echo "::notice::No armed merge to cancel, or cancel not allowed."

      - name: Enable auto-merge
        if: steps.identity.outputs.arm == '1' && steps.approval.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Enabling auto-merge for $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL" || echo "Auto-merge already set or failed."
