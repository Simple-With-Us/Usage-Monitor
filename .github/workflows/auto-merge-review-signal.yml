name: Auto-merge review signal

# Review events run against a pull request ref.  Keep this workflow entirely
# unprivileged; the trusted default-branch auto-merge workflows re-read live PR
# state after this run completes.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  signal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Notify trusted auto-merge workflows
        run: echo "Review event observed; trusted workflow_run will re-evaluate live state."
