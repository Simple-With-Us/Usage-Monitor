name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This throwaway SQLite smoke job has no Datadog agent or production secrets.
    # The visual suite (tests/e2e/visual.spec.ts) asserts committed screenshot
    # baselines in tests/e2e/visual.spec.ts-snapshots/ against a fixed fixture
    # world: frozen clock, stubbed /api/* responses, no live data. DB and auth
    # below are throwaway, test-only values.
    env:
      DD_TRACE_ENABLED: 'false'
      DATABASE_URL: file:./prisma/playwright-visual-test.db
      DASHBOARD_PASSWORD: visual-test-password
      SESSION_SECRET: visual-test-session-secret-not-production
      E2E_TEST_PASSWORD: visual-test-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: echo "DATABASE_URL=file:${RUNNER_TEMP}/api-usage-monitor-e2e.db" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - run: npx playwright test
      # On failure, keep the actual/diff screenshots: the job log only says
      # "exit code 1", so without these there is no way to see WHAT drifted.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
