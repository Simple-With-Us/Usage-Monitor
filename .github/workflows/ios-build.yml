name: iOS build (Mac runner)

# Compile-check the iOS app on the self-hosted Mac runner (mac-xcode26-usage).
#
# XCODE BUILDS ONLY (owner directive, 2026-08-12): this is the sole workflow
# that may target the mac-runner labels; everything else stays on hosted/Linux
# runners. Label routing enforces that — nothing lands on the Mac unless a
# workflow asks for these labels.
#
# The Mac carries stable Xcode 26.x and Xcode-beta 27 side by side. A binary
# built against the beta SDK passes TestFlight upload but is rejected at App
# Store submission as INVALID_BINARY (Congress.Trade 1.0 hit this twice). CI
# pins DEVELOPER_DIR to stable and asserts the version so a stray xcode-select
# can never silently move builds onto the beta.
#
# Deliberately unsigned (CODE_SIGNING_ALLOWED=NO) and no archive/upload —
# TestFlight shipping stays in the fleet ship script, which has its own guard.
# Scope: the iOS app only; the Safari-extension project can be added as a
# second step once it matters.

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (unsigned)
    # Self-hosted Mac: never run fork PRs on it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert stable Xcode (never beta)
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac

      - name: Build UsageMonitor (generic iOS device, unsigned)
        run: |
          # Per-run DerivedData: the shared Mac runner otherwise locks
          # UsageMonitor-*/XCBuildData/build.db when two PRs compile at once.
          # actool can flake when CoreSimulator drops the iPad-3x device;
          # retry once after a short pause.
          build() {
            xcodebuild build \
              -project ios/UsageMonitor/UsageMonitor.xcodeproj \
              -scheme UsageMonitor \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "${RUNNER_TEMP}/um-ios-${GITHUB_RUN_ID}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              ENABLE_PREVIEWS=NO \
              COMPILER_INDEX_STORE_ENABLE=NO
          }
          build || { sleep 20; build; }
