name: Sentry CI Report

# Fleet-wide CI observability: receives request and completion events from the
# observed workflows, but only reserves a runner for scheduled runs and for
# failures.  It reports those actionable events to the shared `fleet-infra`
# Sentry project (org jays-services).  ADDITIVE ONLY — this file must never
# modify the behavior of the workflows it observes.
#
# Three signals across the two phases of one observed run:
#   1. On action == requested AND event == schedule (the run has just been
#      CREATED — GitHub has not allocated a runner yet, and the conclusion is
#      still null): a Sentry Crons check-in with status `in_progress`, which
#      OPENS the check-in for that tick.  No failure event is possible here;
#      there is no conclusion yet to look at.  Before sending it, the job
#      asks the Actions API whether the observed run has already completed
#      and skips the check-in if so, since GitHub does not guarantee this
#      requested-phase run is created before the completed-phase one.
#   2. On action == completed AND conclusion == failure / timed_out /
#      startup_failure: a Sentry error event, tagged with
#      {app, workflow, branch, actor}, carrying the run URL, fingerprinted on
#      [ci-failure, app, workflow] so every failure of one workflow groups into
#      ONE Sentry issue instead of paging separately every time.  The branch is
#      a TAG only, never a fingerprint component (it was until 2026-08-12,
#      which minted a permanent issue per feature branch — ~85 of the fleet's
#      unresolved fleet-infra issues).  The `app` tag + fingerprint component
#      are REQUIRED: the fleet-infra project is shared across repos, and this
#      repo shares workflow names ("CI", "Security", "Effort Issues Sync") with
#      Socratic.Trade / Congress.Trade, so without `app` a "CI" failure here
#      would dedup into the same Sentry issue as a "CI" failure there.  See
#      AGENT-SYNC.md "Observability".
#   3. On action == completed AND event == schedule (the completed run was a
#      cron-triggered run of a workflow that defines `schedule:`): the TERMINAL
#      Sentry Crons check-in (error when the conclusion is one of the alerting
#      conclusions in (2), ok for every other conclusion -- the monitor answers
#      "did this cron fire", and an intentional cancelled / skipped tick is not
#      a failure of the schedule, so it closes the check-in as ok rather than
#      minting a Crons failure with no explanatory event beside it) with an
#      upsert
#      monitor_config whose schedule mirrors that workflow's own cron
#      expression, slug `ci-usage-monitor-<workflow-slug>`.  It carries the SAME
#      check_in_id as (1) — both phases derive it from the observed run id and
#      attempt (uuid5, see checkin_id_for_run in the script) — which is what
#      CLOSES the in_progress check-in that phase 1 opened.  This means a
#      nightly/weekly job that silently STOPS firing (not "runs and fails" but
#      "never runs again") raises a missed-check-in alert instead of going
#      unnoticed.
#
# Why the `requested` activity type and not `in_progress` (FLEET-INFRA-CB,
# 2026-09-08): GitHub's `in_progress` workflow_run activity fires only once a
# runner has actually picked the job up.  For "iOS TestFlight ship (Mac runner)"
# that is a macos-latest job whose runner queueing time would then count
# against `checkin_margin`, which is precisely the latency this change exists
# to stop absorbing.  `requested` fires the moment the run is created, so the
# margin now measures only GitHub's schedule-dispatch delay plus this reporter
# reaching Sentry; the observed job's own runtime bound moved to `max_runtime`
# in MAX_RUNTIME_OVERRIDES.  Note the trade that makes: because the check-in
# opens at run CREATION, `max_runtime` now has to cover the ios-ship-usage
# concurrency-queue wait and the macos-latest allocation as well as the job's
# own timeout-minutes: 120 and the completed-phase reporter.  See the
# MAX_RUNTIME_OVERRIDES comment in scripts/sentry-ci-report.py for the full
# derivation of 260 -- a structural bound sized to what the workflow graph
# permits (observed runs top out at 10.9min), carrying no false-timeout
# exposure of its own.
#
# Re-run caveat: GitHub does NOT fire `requested` when a run is re-run, so a
# re-run attempt opens no in_progress check-in.  Its terminal check-in simply
# stands alone (the check_in_id is keyed on the run ATTEMPT, so it never tries
# to close attempt 1's already-closed check-in) — exactly the behavior this
# reporter had before the requested phase existed.
#
# Raw Sentry envelope HTTP via python3 — no action marketplace dependency, no
# new job permissions beyond what's needed to read the triggering run.
#
# workflows observed (from `ls .github/workflows/` at authoring time — see
# the `name:` header of each file):
#   Auto-merge PRs, Auto-merge congress-trading-shared PRs,
#   Auto-update eligible PRs, CI, CodeQL, Effort Issues Sync,
#   iOS App Store GM ship, iOS build (Mac runner),
#   iOS TestFlight ship (Mac runner), Weekly Model Pricing Audit,
#   Production Deploy Verification, Security, Shared package pin check
#
# DELIBERATELY NOT observed:
#   - Sentry CI Report (this file) — would recurse.
#   - Uptime Monitor — it runs every 5 minutes (`*/5 * * * *`); observing it
#     via workflow_run would fan out to ~288 reporter runs/day (~2880 Actions
#     minutes/month, over the free budget), and a 15-minute check-in margin
#     does not fit a 5-minute schedule. If you want failure coverage for it,
#     add "Uptime Monitor" below AND a right-sized entry to CRON_SCHEDULES in
#     scripts/sentry-ci-report.py (margin/runtime tuned for a 5-min cadence).
#
# Cron schedules mirrored for the check-in step (must match the source
# workflow's `schedule:` block AND its `name:`; keep in sync if those change).
# The reporter validates these keys against the real workflow names on every
# run and raises a Sentry issue on drift, so a rename cannot silently kill a
# monitor:
#   CI                                  -> "41 * * * *"     (ci.yml hourly backstop)
#   CodeQL                              -> "23 9 * * 2"     (codeql.yml, Tuesdays)
#   Effort Issues Sync                  -> "12 6 * * *"     (effort-issues-sync.yml, daily)
#   iOS TestFlight ship (Mac runner)    -> "13,43 * * * *"  (ios-ship.yml)
#   Weekly Model Pricing Audit          -> "0 0 * * 0"      (pricing-audit.yml, Sundays)
#   Security                            -> "41 10 * * 1"    (security.yml, Mondays)
#   Shared package pin check            -> "0 13 * * 1"     (shared-package-pin-check.yml, Mondays)
#
# Secret: repo (or org) Actions secret `SENTRY_FLEET_DSN` must be set to the
# fleet-infra project DSN. Name only — never commit or print the value.
# ST/CT already have this secret; Usage-Monitor still needs it added before
# failure events will reach Sentry (the reporter exits 0 with a warning when
# the secret is absent, so CI itself is never red-X'd by a missing DSN).

on:
  workflow_run:
    workflows:
      # Names must match the `name:` field of workflow files exactly —
      # a stale entry here silently disables alerting for that pipeline.
      - Auto-merge PRs
      - Auto-merge congress-trading-shared PRs
      - Auto-update eligible PRs
      - CI
      - CodeQL
      - Effort Issues Sync
      - iOS App Store GM ship
      - iOS build (Mac runner)
      - iOS TestFlight ship (Mac runner)
      - Weekly Model Pricing Audit
      - Production Deploy Verification
      - Security
      - Shared package pin check
      - Sentry Deploy
    types: [requested, completed]

permissions:
  contents: read

concurrency:
  # Keyed on the OBSERVED run id, so the `requested` and `completed` reporter
  # runs for ONE observed run share this group.  With cancel-in-progress:
  # false the group serializes those two reporter runs WHENEVER the
  # requested-phase run is created first, which is the normal case — the
  # in_progress check-in then reaches Sentry before the terminal check-in
  # bearing the same check_in_id.  GitHub does NOT guarantee that order,
  # though: for a very fast observed run, GitHub can create the
  # completed-phase reporter run before the requested-phase one, so the
  # terminal check-in could reach Sentry first.  To stay correct either way,
  # the requested-phase job also asks the Actions API (permissions:
  # actions: read, below) whether the observed run has already completed —
  # fetch_observed_run_status() in scripts/sentry-ci-report.py — and skips
  # its in_progress check-in when it has, leaving the terminal check-in
  # standing alone exactly as it stood before this change.  Sentry's own
  # monitor consumer also treats an in_progress update that arrives after a
  # terminal check-in as out-of-order and leaves the terminal status
  # unchanged (sentry/src/sentry/monitors/consumers/monitor_consumer.py,
  # is_out_of_order_in_progress), so this skip is belt-and-suspenders on top
  # of that, not the only thing preventing a stale in_progress from
  # resurrecting a closed check-in.
  group: sentry-ci-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  # The script has no side effect for an ordinary successful push/PR/manual
  # run. Gate those events before runner scheduling so observability cannot
  # starve CI with guaranteed no-op jobs. Keep this list in lockstep with
  # ALERT_CONCLUSIONS in scripts/sentry-ci-report.py. Every scheduled run
  # remains eligible because Sentry Crons needs both success and error
  # check-ins.
  #
  # `requested`-type runs are gated to SCHEDULED observed runs only: the
  # in_progress check-in exists for cron monitors and nothing else, so every
  # push / PR / manual `requested` event is skipped here, before a runner is
  # ever allocated (zero Actions minutes).  This does roughly double the number
  # of skipped reporter entries in the Actions list — one per requested event
  # on top of one per completed event — which is accepted: they cost nothing
  # but a list row, and the alternative (an ungated requested listener) would
  # burn a runner on every push.
  report:
    permissions:
      contents: read
      # Lets the requested-phase job ask the Actions API for the observed
      # run's own status (fetch_observed_run_status() in
      # scripts/sentry-ci-report.py) before sending its in_progress
      # check-in, so it can skip that check-in if the observed run has
      # already completed — see the `concurrency` comment above.
      actions: read
    if: >-
      (github.event.action == 'requested' && github.event.workflow_run.event == 'schedule') ||
      (github.event.action == 'completed' && (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for the reporter script only; does not touch observed workflows)
        # Deliberately no `ref:` override: actions/checkout defaults workflow_run events to the
        # repo's default branch (main), NOT the head ref of the triggering run. That's intentional
        # here — it means this step always executes the trusted, merged copy of the reporter
        # script rather than whatever version lives on an arbitrary (possibly fork/PR) branch that
        # triggered the observed workflow. Do not add `ref: ${{ github.event.workflow_run.head_sha }}`
        # without re-reviewing the security implications.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report cron check-in (in_progress at request, ok/error at completion) and failure event to Sentry fleet-infra
        shell: bash
        env:
          SENTRY_FLEET_DSN: ${{ secrets.SENTRY_FLEET_DSN }}
          # Scoped to this job's own `permissions:` above (contents: read,
          # actions: read) — used only by fetch_observed_run_status() to
          # read the observed run's status, never printed or logged.
          # GITHUB_REPOSITORY and GITHUB_API_URL are default runner env vars
          # and do not need to be set here.
          GITHUB_TOKEN: ${{ github.token }}
          # Which phase of the observed run this reporter is handling:
          # "requested" (open the in_progress check-in) or "completed" (failure
          # event + terminal check-in).
          WORKFLOW_RUN_ACTION: ${{ github.event.action }}
          # Part of the deterministic check_in_id, so a re-run (which never
          # fires `requested`) gets its own id instead of reclosing attempt 1's.
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/sentry-ci-report.py
