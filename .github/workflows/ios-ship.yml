name: iOS TestFlight ship (Mac runner)

# Archive + upload on GitHub-hosted macos-latest so TestFlight (the phone)
# actually updates when iOS code lands on main. Unsigned compile stays in
# ios-build.yml. Do not run xcodebuild locally. Do not restart a self-hosted
# Mac runner or /Users/jay/apps/ios-fleet.
#
# Signing: scripts/ios-appstore-gm-prepare.sh stages the ASC key (path handed on via GITHUB_ENV) from Infisical prod
# (identity stays on GitHub; leftover GH ASC_/IOS_DIST_ for later cleanup) (same names as Congress.Trade / Socratic.Trade #3089:
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, IOS_DIST_P12_BASE64,
# IOS_DIST_P12_PASSWORD). Never mint a new App Store Connect key.
#
# AFC-459: the key crosses the step boundary in the base64 trio the client
# reads first (APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8_BASE64),
# because the App Store Connect client takes its credential from the environment
# and never from a path on disk.  ASC_KEY_PATH still carries the mode-600 file
# for the Apple tools.
#
# Ships Usage Monitor Client and LocalUsageMonitor (Import Package tap).
#
# RE-ENABLED 2026-10-17 (owner: bring every app up to date).  This workflow sat
# `disabled_manually` after the 2026-09-27 failures ("no App Store Connect record
# yet", ascRecordPending).  #1652 pointed apps.json at the live .ios records
# (6820881005 client, 6820885210 local) but nobody turned the workflow back on,
# so merges such as #1683 reached main and never reached TestFlight.  A merge to
# main that touches ios/ now uploads both apps with no human step.  If this file
# is ever disabled again, `gh workflow view ios-ship.yml` will say so; check
# that state before assuming an iOS merge shipped.
#
# The two ship steps are independent: each is gated on its own app's output from
# the scheduled gate, and Local still runs when the Client upload failed (they
# are separate ASC records with separate failure modes).  Rate gate and
# same-HEAD skip stay at the ship script defaults -- no standing override.
#
# PLAN-BUILD (owner, Oct 29 2026): CFBundleVersion is max(S, M + 1), a 12-digit
# merge-stamp build computed ONCE per release per app by the "Plan release
# builds" step below (--plan-build-only: registry + HEAD merge stamp + ASC
# inventory + Sparkle feed floor, read-only) and handed to each ship step as
# --build.  Each app (usage, usage-local) has its own counter, so each gets
# its own planned value.  A ship given --build never plans; it only verifies
# the value clears this app record's own platform inventory.  A skipped ship
# uploads nothing, planned or not.  This repo ships no Mac app to TestFlight
# (Mac releases go out over Sparkle), so there is no second platform job to
# feed; a future Mac TestFlight ship must take the same planned value.
#
# WHY THERE IS A `schedule:` TRIGGER (2026-08-13)
# ----------------------------------------------
# `push:` alone is not a reliable trigger. A PR merged by github-actions[bot]
# (auto-merge armed with GITHUB_TOKEN) lands on main under GitHub's recursion
# guard and dispatches NOTHING. Measured: PR #1145, a bot merge touching ios/,
# produced no ios-ship run at all; #1159, a human merge, produced the only
# ios-ship run this repo has ever had. iOS code was reaching main and never
# reaching a phone. `schedule:` events are exempt from the recursion guard.
#
# GH_PAT (2026-08-13): the repo secret is the elevated merge identity. Auto-merge
# armed with GH_PAT merges as that PAT, so a bot squash still fires this
# workflow. The cron is now a backstop, not the only path. Do not fall back to
# GITHUB_TOKEN for merges.
#
# Hosted runners have an empty home directory each job, so ~/.cache/ios-fleet
# is restored from actions/cache. Without that cache every scheduled tick
# would look like "no prior ship" and re-archive.
#
# NOT EVERY TICK SHIPS -- the scheduled path is guarded twice.
#   1. scripts/ios-scheduled-ship-gate.sh refuses to try unless one of the
#      on.push.paths entries below actually changed between the last
#      successful ship and HEAD. A cron carries no `paths:` filter of its
#      own, so without this a backend-only commit would ship a TestFlight
#      build. The owner does not want TestFlight spammed; this is the guard
#      that prevents it. The gate step passes every push path as its own
#      --path-prefix (one place, this file; the gate test fails if they
#      drift), so a merge the push trigger missed still ships on the
#      next tick.
#   2. The fleet ship script then rate-limits successful uploads to one per app
#      per DEFAULT_MIN_INTERVAL_SEC=3600 seconds (1 hour) and independently
#      skips when git HEAD already shipped. Those runs print "ship-gate: skip"
#      and exit 0. Neither kind of skip consumes a build number.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ship.yml'
      - 'scripts/ios-*.sh'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-fleet-pin.sh'
      - 'scripts/ios-fleet.sha256'
  workflow_dispatch:
  schedule:
    # Twice an hour, offset from Socratic.Trade ('*/30') and Congress.Trade
    # ('7,37') so the three fleet repos do not start three ships on the same
    # minute.
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: ios-ship-usage
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate diffs HEAD against the sha recorded by the last successful
          # ship, which can be many commits back. Default depth-1 makes that
          # range uncomputable and the gate would degrade to skipping forever.
          fetch-depth: 0

      # Restore and save are separate steps (not the single actions/cache step)
      # because actions/cache only saves in its post step, and the post step is
      # skipped when the job fails.  Client and Local are independent now, so
      # one app can upload while the other fails; the successful app's
      # last-ship-<app>.txt must still be saved or the next tick would see no
      # state and re-upload it, which is exactly the TestFlight spam the rate
      # gate exists to prevent.
      - name: Restore iOS ship state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-usage-${{ github.run_id }}
          restore-keys: |
            ios-fleet-usage-

      # Runs FIRST so a tick with nothing to ship costs seconds.
      # Logic lives in a script, not inline YAML, so CI can unit-test it on
      # every PR instead of it only ever being exercised on the ship job.
      # usage-local is included so LocalUsageMonitor ships when a push path changes.
      - name: Scheduled ship gate (skip unless a push path changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/**' \
            --path-prefix '.github/workflows/ios-ship.yml' \
            --path-prefix 'scripts/ios-*.sh' \
            --path-prefix 'scripts/ios-fleet/**' \
            --path-prefix 'scripts/ios-fleet-pin.sh' \
            --path-prefix 'scripts/ios-fleet.sha256' \
            --repo-root "$GITHUB_WORKSPACE" \
            usage usage-local

      - name: Verify in-repo ios-fleet pin
        if: steps.gate.outputs.should_ship == '1'
        run: bash scripts/ios-fleet-pin.sh --check

      - name: Assert stable Xcode and a non-beta host OS
        if: steps.gate.outputs.should_ship == '1'
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          # Apple stamps BuildMachineOSBuild into the IPA. A beta host
          # (trailing letter after digits, e.g. 26A5406e) is Invalid Binary.
          os=$(sw_vers -productVersion)
          build=$(sw_vers -buildVersion)
          echo "macOS ${os} (${build})"
          if echo "$build" | grep -Eq '[0-9][a-z]$'; then
            echo "::error::macOS ${os} build ${build} is a beta host. App Store rejects these as INVALID_BINARY."
            exit 1
          fi

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects it
      # (`Unrecognized named-value: secrets`) and the whole workflow dies at 0s.

      # Identity stays on GitHub.  Apple/iOS signing material comes from Infisical prod.
      - name: Load Infisical signing secrets
        id: signing
        if: steps.gate.outputs.should_ship == '1'
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          if [ -z "${INFISICAL_PROJECT_ID:-}" ]; then
            echo "::error::Missing INFISICAL_PROJECT_ID GitHub secret."
            exit 1
          fi
          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-${INFISICAL_CLIENT_ID:-}}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-${INFISICAL_CLIENT_SECRET:-}}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
            echo '::error::Infisical returned a multiline token.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

          # ASC API credentials live in the Fleet-OPS Infisical project under /asc
          # (owner ruling 2026-10-11).  The distribution certificate stays in
          # this app's project at / -- two sources, resolved independently.
          FLEET_ASC_PROJECT_ID="8dae6d03-8f12-48b2-adf3-e5c1b881c8c5"
          FLEET_ASC_PATH="/asc"

          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$FLEET_ASC_PROJECT_ID" --env=prod --path="$FLEET_ASC_PATH" \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              echo "::error::Missing $name in Fleet-OPS /asc (project $FLEET_ASC_PROJECT_ID)." >&2
              exit 1
            fi
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line; correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf -v "$name" '%s' "$val"
            export "$name"
            printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
          done

          for name in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              continue
            fi
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line; correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf -v "$name" '%s' "$val"
            export "$name"
            # Certificate credentials belong only to this load/import step.
          done
          # The key material crosses the step boundary in two shapes (AFC-459).
          #
          # APPLE_API_KEY_P8_BASE64 carries the key in the environment, because
          # the App Store Connect client resolves its credential from the
          # environment and from Infisical and never from a path on disk:  a
          # path is not an approved secret source, so the client no longer
          # reads one.  It is the base64 form because the raw PEM is
          # multiline and must not sit in a step environment (AFC-359), and
          # the base64 form is one line.
          # ASC_KEY_PATH still carries the mode-600 file, because the Apple
          # tools (security import, altool, xcodebuild
          # -authenticationKeyPath) can only read a key from disk, and that
          # file is written from the credential rather than read back as one.
          key_material="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$FLEET_ASC_PROJECT_ID" --env=prod --path="$FLEET_ASC_PATH" \
              2>/dev/null || true
          )"
          if [ -z "$key_material" ]; then
            echo "::error::Missing ASC key material in Infisical prod."
            exit 1
          fi
          # Mask every line of the raw PEM before staging it.  One add-mask
          # carrying a multiline value only masks its first line.
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              line="${line//%/%25}"; line="${line//$'\r'/%0D}"
              printf '::add-mask::%s\n' "$line"
            fi
          done <<< "$key_material"
          # One line, so GITHUB_ENV carries it natively, and the raw PEM never
          # reaches a step environment.  The same form the client reads first.
          # Mask the base64 form before it reaches GITHUB_ENV: GitHub prints
          # every later step's env block in the public log.
          key_b64="$(printf '%s' "$key_material" | base64 | tr -d '\n')"
          echo "::add-mask::${key_b64}"
          printf 'APPLE_API_KEY_ID=%s\n' "$ASC_KEY_ID" >> "$GITHUB_ENV"
          printf 'APPLE_API_ISSUER_ID=%s\n' "$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          printf 'APPLE_API_KEY_P8_BASE64=%s\n' "$key_b64" >> "$GITHUB_ENV"
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          ASC_KEY_PATH="$(sed -n 's/^ASC_KEY_PATH=//p' "$GITHUB_ENV" | tail -n 1)"
          export ASC_KEY_PATH
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"
          unset key_material key_b64 line TOKEN CLIENT_ID CLIENT_SECRET val IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD

      # Plan-build: compute each app's release build ONCE here and hand it to
      # the ship steps as --build, so the two ships of one release can never
      # plan different builds.  Read-only (registry + HEAD merge stamp + ASC
      # inventory + feed floor); a later ship-gate skip still uploads nothing.
      # Runs after signing load because the ASC inventory read needs the same
      # credential the ships use.  Never echoes secrets; build numbers are
      # not secret.
      - name: Plan release builds (once per app per release)
        id: plan
        if: steps.gate.outputs.should_ship == '1'
        env:
          SHIP_USAGE: ${{ steps.gate.outputs.ship_usage }}
          SHIP_USAGE_LOCAL: ${{ steps.gate.outputs.ship_usage_local }}
        run: |
          set -euo pipefail
          plan_one() {
            local app="$1" out="$2" build
            build="$(bash "$GITHUB_WORKSPACE/scripts/ios-fleet/ship-testflight.sh" "$app" --repo-root "$GITHUB_WORKSPACE" --plan-build-only)"
            [[ "$build" =~ ^[1-9][0-9]{11}$ ]] || { echo "::error::plan-build for ${app} printed '${build}', not a 12-digit merge-stamp build"; exit 1; }
            printf '%s=%s\n' "$out" "$build" >> "$GITHUB_OUTPUT"
          }
          if [ "${SHIP_USAGE:-0}" = "1" ]; then plan_one usage build_usage; fi
          if [ "${SHIP_USAGE_LOCAL:-0}" = "1" ]; then plan_one usage-local build_usage_local; fi

      - name: Ship UsageMonitor to TestFlight
        id: ship_usage
        if: ${{ steps.plan.outcome == 'success' && steps.gate.outputs.ship_usage == '1' }}
        env:
          IOS_TF_RELEASE_NOTES: "1"  # Jay 2026-09-08: publish ASC What to Test
        run: |
          build="${{ steps.plan.outputs.build_usage }}"
          [[ "$build" =~ ^[1-9][0-9]{11}$ ]] || { echo "::error::missing planned build for usage; refusing to re-plan"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/ios-ship-testflight.sh" --build "$build"

      # Sync the standing testers and attach/submit the new build to the public
      # external group.  A failure here is a warning, never a red ship.
      - name: Sync standing TestFlight testers (usage)
        if: success() && steps.gate.outputs.ship_usage == '1'
        continue-on-error: true
        env:
          ASC_STANDING_TESTERS: ${{ secrets.ASC_STANDING_TESTERS }}
        run: |
          for e in $(printf '%s' "${ASC_STANDING_TESTERS:-}" | tr ',;' '  '); do
            echo "::add-mask::${e}"
          done
          set +e
          appleid="$(python3 -c 'import json;print(json.load(open("scripts/ios-fleet/apps.json"))["apps"]["usage"]["appleId"])')"
          appleid_rc=$?
          set -e
          if [ "$appleid_rc" -ne 0 ] || [ -z "$appleid" ]; then
            echo "::warning title=TestFlight standing testers::could not read the usage appleId from scripts/ios-fleet/apps.json (rc=${appleid_rc}); tester sync skipped.  The TestFlight upload itself succeeded."
            exit 0
          fi
          set +e
          node scripts/ios-fleet/asc-api.mjs ensure-standing-testers "$appleid"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=TestFlight standing testers::tester sync exited ${rc}; see the standing-testers lines above.  The TestFlight upload itself succeeded."
          fi

      # !cancelled() so a Client failure does not silently skip Local; the
      # secrets step must have succeeded so we never ship without signing.
      - name: Ship LocalUsageMonitor to TestFlight
        id: ship_usage_local
        if: ${{ !cancelled() && steps.signing.outcome == 'success' && steps.plan.outcome == 'success' && steps.gate.outputs.ship_usage_local == '1' }}
        env:
          IOS_TF_RELEASE_NOTES: "1"
        run: |
          build="${{ steps.plan.outputs.build_usage_local }}"
          [[ "$build" =~ ^[1-9][0-9]{11}$ ]] || { echo "::error::missing planned build for usage-local; refusing to re-plan"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/ios-ship-testflight-local.sh" --build "$build"

      # Sync the standing testers and attach/submit the new build to the public
      # external group.  A failure here is a warning, never a red ship.
      - name: Sync standing TestFlight testers (usage-local)
        if: ${{ !cancelled() && steps.ship_usage_local.outcome == 'success' && steps.gate.outputs.ship_usage_local == '1' }}
        continue-on-error: true
        env:
          ASC_STANDING_TESTERS: ${{ secrets.ASC_STANDING_TESTERS }}
        run: |
          for e in $(printf '%s' "${ASC_STANDING_TESTERS:-}" | tr ',;' '  '); do
            echo "::add-mask::${e}"
          done
          set +e
          appleid="$(python3 -c 'import json;print(json.load(open("scripts/ios-fleet/apps.json"))["apps"]["usage-local"]["appleId"])')"
          appleid_rc=$?
          set -e
          if [ "$appleid_rc" -ne 0 ] || [ -z "$appleid" ]; then
            echo "::warning title=TestFlight standing testers::could not read the usage-local appleId from scripts/ios-fleet/apps.json (rc=${appleid_rc}); tester sync skipped.  The TestFlight upload itself succeeded."
            exit 0
          fi
          set +e
          node scripts/ios-fleet/asc-api.mjs ensure-standing-testers "$appleid"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=TestFlight standing testers::tester sync exited ${rc}; see the standing-testers lines above.  The TestFlight upload itself succeeded."
          fi

      # Saved even when a ship step failed or the run was cancelled, but only on
      # ticks that actually tried to ship (a no-op tick changes no state).
      - name: Save iOS ship state
        if: ${{ always() && steps.gate.outputs.should_ship == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-usage-${{ github.run_id }}
