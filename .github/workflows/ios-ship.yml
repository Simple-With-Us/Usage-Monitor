name: iOS TestFlight ship (Mac runner)

# Archive + upload on GitHub-hosted macos-latest so TestFlight (the phone)
# actually updates when iOS code lands on main. Unsigned compile stays in
# ios-build.yml. Do not run xcodebuild locally. Do not restart a self-hosted
# Mac runner or /Users/jay/apps/ios-fleet.
#
# Signing: scripts/ios-appstore-gm-prepare.sh writes ~/.secrets from Infisical prod
# (identity stays on GitHub; leftover GH ASC_/IOS_DIST_ for later cleanup) (same names as Congress.Trade / Socratic.Trade #3089:
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, IOS_DIST_P12_BASE64,
# IOS_DIST_P12_PASSWORD). Never mint a new App Store Connect key.
#
# Ships Usage Client Monitor and LocalUsageMonitor (Import Package tap).
#
# WHY THERE IS A `schedule:` TRIGGER (2026-08-13)
# ----------------------------------------------
# `push:` alone is not a reliable trigger. A PR merged by github-actions[bot]
# (auto-merge armed with GITHUB_TOKEN) lands on main under GitHub's recursion
# guard and dispatches NOTHING. Measured: PR #1145, a bot merge touching ios/,
# produced no ios-ship run at all; #1159, a human merge, produced the only
# ios-ship run this repo has ever had. iOS code was reaching main and never
# reaching a phone. `schedule:` events are exempt from the recursion guard.
#
# GH_PAT (2026-08-13): the repo secret is the elevated merge identity. Auto-merge
# armed with GH_PAT merges as that PAT, so a bot squash still fires this
# workflow. The cron is now a backstop, not the only path. Do not fall back to
# GITHUB_TOKEN for merges.
#
# Hosted runners have an empty home directory each job, so ~/.cache/ios-fleet
# is restored from actions/cache. Without that cache every scheduled tick
# would look like "no prior ship" and re-archive.
#
# NOT EVERY TICK SHIPS -- the scheduled path is guarded twice.
#   1. scripts/ios-scheduled-ship-gate.sh refuses to try unless ios/ actually
#      changed between the last successful ship and HEAD. A cron carries
#      no `paths:` filter of its own, so without this a backend-only commit
#      would ship a TestFlight build. The owner does not want TestFlight
#      spammed; this is the guard that prevents it.
#   2. The fleet ship script then rate-limits successful uploads to one per app
#      per DEFAULT_MIN_INTERVAL_SEC=3600 seconds (1 hour) and independently
#      skips when git HEAD already shipped. Those runs print "ship-gate: skip"
#      and exit 0. Neither kind of skip consumes a build number.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ship.yml'
      - 'scripts/ios-*.sh'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-fleet-pin.sh'
      - 'scripts/ios-fleet.sha256'
  workflow_dispatch:
  schedule:
    # Twice an hour, offset from Socratic.Trade ('*/30') and Congress.Trade
    # ('7,37') so the three fleet repos do not start three ships on the same
    # minute.
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: ios-ship-usage
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The gate diffs HEAD against the sha recorded by the last successful
          # ship, which can be many commits back. Default depth-1 makes that
          # range uncomputable and the gate would degrade to skipping forever.
          fetch-depth: 0

      - name: Restore iOS ship state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-usage-${{ github.run_id }}
          restore-keys: |
            ios-fleet-usage-

      # Runs FIRST so a tick with nothing to ship costs seconds.
      # Logic lives in a script, not inline YAML, so CI can unit-test it on
      # every PR instead of it only ever being exercised on the ship job.
      # usage-local is included so LocalUsageMonitor ships when ios/ changes.
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/' \
            --repo-root "$GITHUB_WORKSPACE" \
            usage usage-local

      - name: Verify in-repo ios-fleet pin
        if: steps.gate.outputs.should_ship == '1'
        run: bash scripts/ios-fleet-pin.sh --check

      - name: Assert stable Xcode and a non-beta host OS
        if: steps.gate.outputs.should_ship == '1'
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          # Apple stamps BuildMachineOSBuild into the IPA. A beta host
          # (trailing letter after digits, e.g. 26A5406e) is Invalid Binary.
          os=$(sw_vers -productVersion)
          build=$(sw_vers -buildVersion)
          echo "macOS ${os} (${build})"
          if echo "$build" | grep -Eq '[0-9][a-z]$'; then
            echo "::error::macOS ${os} build ${build} is a beta host. App Store rejects these as INVALID_BINARY."
            exit 1
          fi

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects it
      # (`Unrecognized named-value: secrets`) and the whole workflow dies at 0s.

      # Identity stays on GitHub.  Apple/iOS signing material comes from Infisical prod.
      - name: Load Infisical signing secrets
        if: steps.gate.outputs.should_ship == '1'
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          if [ -z "${INFISICAL_PROJECT_ID:-}" ]; then
            echo "::error::Missing INFISICAL_PROJECT_ID GitHub secret."
            exit 1
          fi
          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-${INFISICAL_CLIENT_ID:-}}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-${INFISICAL_CLIENT_SECRET:-}}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          for name in ASC_KEY_ID ASC_ISSUER_ID \
                      IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              continue
            fi
            echo "::add-mask::$val"
            {
              echo "${name}<<INFISICAL_EOF"
              printf '%s\n' "$val"
              echo "INFISICAL_EOF"
            } >> "$GITHUB_ENV"
          done
          # Keep multiline PEM out of GITHUB_ENV and every later step environment.
          # Only its mode-600 file path crosses the step boundary.
          key_material="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
              2>/dev/null || true
          )"
          if [ -z "$key_material" ]; then
            echo "::error::Missing ASC key material in Infisical prod."
            exit 1
          fi
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          unset key_material TOKEN CLIENT_ID CLIENT_SECRET val

      - name: Import signing + ASC key
        if: steps.gate.outputs.should_ship == '1'
        run: |
          if [ -z "${ASC_KEY_ID}" ]; then
            echo "::error::ASC_KEY_ID empty after Infisical prod export. Copy ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD from Congress.Trade (same team CC8UTF7ATG). Do not mint a new key. Do not restart a Mac runner."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      # Via the in-repo wrappers rather than /Users/jay/apps/ios-fleet directly:
      # the wrappers pin DEVELOPER_DIR to stable Xcode and resolve --repo-root,
      # so the workflow cannot drift from what a local operator runs.
      # No --force-ship. Standing rate limit is DEFAULT_MIN_INTERVAL_SEC=3600.
      - name: Ship UsageMonitor to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_TF_RELEASE_NOTES: "1"  # Jay 2026-09-08: publish ASC What to Test
        run: bash "$GITHUB_WORKSPACE/scripts/ios-ship-testflight.sh"

      - name: Ship LocalUsageMonitor to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_TF_RELEASE_NOTES: "1"
        run: bash "$GITHUB_WORKSPACE/scripts/ios-ship-testflight-local.sh"
